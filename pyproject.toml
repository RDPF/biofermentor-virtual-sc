[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biofermentor-virtual-sc"
version = "3.0.0"
description = "Auditable scientific virtual fermentor for S. cerevisiae ethanol process-control studies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Renato Dutra Pereira Filho"}]
dependencies = ["numpy>=1.24"]
keywords = ["fermentation", "bioprocess", "process control", "Saccharomyces cerevisiae", "parameter estimation", "validation", "reproducible research", "phenomenological modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]


[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "scipy>=1.10", "PyYAML>=6.0"]
gui = ["matplotlib>=3.7"]
all = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.7", "scipy>=1.10", "PyYAML>=6.0"]

[project.scripts]
biofermentor = "biofermentor.cli:main"
biofermentor-gui = "biofermentor.gui.app:main"
biofermentor-validation-report = "biofermentor.validation_report:main"
biofermentor-external-validation = "biofermentor.external_validation:main"
biofermentor-identifiability = "biofermentor.identifiability_report:main"
biofermentor-fit = "biofermentor.parameter_estimation_report:main"
biofermentor-independent-validation = "biofermentor.independent_validation_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
