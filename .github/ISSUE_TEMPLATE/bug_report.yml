name: Bug report
description: Report a reproducible software, GUI, numerical, or packaging defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please separate reproducible software defects from scientific-model disagreements when possible."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest recipe/command that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation method, and relevant package versions.
